# react_base — keep-last-5 profile
#
# Keeps the last 5 tool results verbatim; older ones are replaced with a
# placeholder by KeepLastNToolResultsCompactor. For full-history runs see
# default.yaml.

agent:
  main_max_turns: 25
  keep_tool_result: 5
  tool_result_max_chars: 100000
  tool_timeout_s: 900
  llm_timeout_s: 600
  max_input_tokens: 262144
  thinking_in_history: true
