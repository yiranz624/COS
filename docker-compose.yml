services:
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${AGENT_HARNESS_IMAGE:-agent-harness:local}"
    init: true
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      REACT_BASE_MODEL_CONFIG: "${REACT_BASE_MODEL_CONFIG:-gpt_5_mini.yaml}"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./benchmarks/datasets:/app/benchmarks/datasets:ro
      - ./results/${AGENT_HARNESS_USER_SLUG:-local}:/app/results
      - ./logs/${AGENT_HARNESS_USER_SLUG:-local}:/app/logs
      - ./data/${AGENT_HARNESS_USER_SLUG:-local}:/app/data
